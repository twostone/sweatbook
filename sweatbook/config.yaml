# https://developers.home-assistant.io/docs/apps/configuration
name: Sweatbook
# Managed by Release Please (see release-please-config.json): do not edit the version by hand.
version: "0.0.0" # x-release-please-version
slug: sweatbook
description: Training tracken und planen
url: "https://github.com/twostone/sweatbook"
arch:
  - aarch64
  - amd64
# Prebuilt by the release workflow. No tag here: Home Assistant appends "version" as the tag.
image: ghcr.io/twostone/sweatbook
ingress: true
ingress_port: 8099
panel_icon: mdi:dumbbell
panel_title: Sweatbook
# Every HA user gets their own training data (keyed by the ingress user), so the panel is not admin-only.
panel_admin: false
# Options land in /data/options.json (written by the Supervisor); a change needs a restart.
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
