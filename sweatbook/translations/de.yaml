configuration:
  log_level:
    name: Protokollstufe
    description: Wie viel die App in ihr Protokoll schreibt.
  mcp_enabled:
    name: MCP-Server
    description: Schaltet den MCP-Endpunkt /mcp ein, über den ein MCP-fähiger Agent mit einem Access Token auf das Training zugreift. Access Token legst du in der App im Profil (Icon oben rechts) an. Danach unter Netzwerk einen Host-Port für 8099 vergeben.
  app_external_url:
    name: Externe Adresse der App
    description: Öffentliche HTTPS-Adresse, unter der dein Reverse Proxy Port 8099 erreichbar macht (z. B. https://sweatbook.example.com). Damit melden sich MCP-Clients per OAuth bei Home Assistant an.
  ha_external_url:
    name: Externe Adresse von Home Assistant
    description: Nur nötig, wenn sie nicht unter Einstellungen → System → Netzwerk eingetragen ist. Leer lassen, dann übernimmt die App diesen Wert.
network:
  8099/tcp: MCP-Endpunkt (/mcp), nur mit Access Token oder Anmeldung über Home Assistant
